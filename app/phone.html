<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c0a">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Exile Companion</title>
<style>
/* Phone screen: a read-only view of what the overlay shows, served by the desktop app on your home network */
@font-face{font-family:"Source Sans 3";src:url("/fonts/SourceSans3.ttf") format("truetype");font-weight:200 900;font-display:swap}
@font-face{font-family:"Cinzel";src:url("/fonts/Cinzel.woff") format("woff");font-weight:400 900;font-display:swap}
:root{--bg:#0e0c0a;--panel:#18140f;--line:#3a3024;--text:#efe6d6;--muted:#a59c8f;--gold:#e9c46a;--good:#71c27a;--bad:#e0584b;--warn:#e9c46a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Source Sans 3","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-family:Cinzel,serif;font-size:19px;margin:0;color:var(--gold);letter-spacing:.02em}
.st{font-size:12px;color:var(--muted);white-space:nowrap}.st.off{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.big{font-size:22px;font-weight:700}.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
ul{margin:0;padding-left:18px}li{margin:3px 0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin:2px 4px 2px 0}
.pill.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}.pill.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);color:var(--good)}
.trade{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.trade:first-of-type{border-top:0;margin-top:0;padding-top:0}
.bar{height:8px;background:#2a231a;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
#err{display:none}
</style>
</head>
<body>
<header><h1>Exile Companion</h1><span class="st" id="st">Connecting…</span></header>
<div class="card" id="err"></div>
<main id="out"></main>
<footer>Read-only view from the desktop app on your PC. This product isn't affiliated with or endorsed by Grinding Gear Games in any way.</footer>
<script>
"use strict";
const key=new URLSearchParams(location.search).get("k")||"";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v==null||!isFinite(v)?"–":Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":Math.abs(v)>=10?Math.round(v).toString():(+v).toFixed(1);
const dur=ms=>{if(!ms)return "–";const s=Math.round(ms/1000),m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}:${String(s%60).padStart(2,"0")}`};
let lastOk=0,lastJson="";
function card(title,html){return html?`<section class="card"><h2>${esc(title)}</h2>${html}</section>`:""}
function render(d){
  const p=d&&d.overlay;if(!p){$("out").innerHTML=card("Waiting",`<p class="muted" style="margin:0">Open the desktop app and start the game: this fills in as you play.</p>`);return}
  let h="";
  const ch=p.char||{},z=p.zone;
  h+=card("Now",`<div class="big">${esc(z?z.name:"Not in game")}</div><div class="muted small">${[ch.name?esc(ch.name):"",ch.level?`level ${ch.level}`:"",z&&z.lvl?`area level ${z.lvl}`:"",p.eta?`next level in ${esc(p.eta)}`:""].filter(Boolean).join(" · ")}</div>
    ${p.xp&&p.xp.label?`<div class="small" style="margin-top:4px;color:var(--${p.xp.cls==="good"?"good":p.xp.cls==="bad"?"bad":"warn"})">${esc(p.xp.label)}</div>`:""}`);
  if(p.trades&&p.trades.length)h+=card("Trade requests",p.trades.map(t=>`<div class="trade"><div class="row"><b>${esc(t.name)}</b>${t.joined?'<span class="pill good">in your hideout</span>':""}</div>
    <div>${esc(t.item)} · <b>${esc(t.price)}</b></div>${t.where?`<div class="muted small">${esc(t.where)}</div>`:""}</div>`).join(""));
  if(p.mode==="campaign"&&p.campaign){const c=p.campaign;
    h+=card(`Act ${c.act}${c.target?` · aim for level ${c.target}`:""}`,`${c.steps&&c.steps.length?`<ul>${c.steps.map(s=>`<li>${esc(s.text)}</li>`).join("")}</ul>`:'<p class="muted" style="margin:0">Act done.</p>'}
      ${c.gems&&c.gems.length?`<p class="small" style="margin:8px 0 0"><b>Gems:</b> ${c.gems.map(esc).join(" · ")}</p>`:""}
      ${c.split&&c.split.bestMs?`<p class="small muted" style="margin:6px 0 0">This act ${dur(c.split.actMs)} · best ${dur(c.split.bestMs)}</p>`:""}`);
    if(p.notes&&p.notes.lines)h+=card("Guide notes",`<div class="small muted">${esc(p.notes.title)}</div><ul>${p.notes.lines.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`);
  }
  if(p.maps){const m=p.maps,cur=m.current,s=m.session||{};
    if(cur)h+=card("This map",`<div class="row"><span class="big">${esc(cur.name)}</span>${cur.tier?`<span class="muted">tier ${cur.tier}</span>`:""}</div>
      <div class="muted small">${[cur.start?`running ${dur(Date.now()-cur.start)}`:"",cur.deaths?`${cur.deaths} death${cur.deaths>1?"s":""}`:""].filter(Boolean).join(" · ")}</div>
      ${m.cards&&m.cards.length?`<p class="small" style="margin:6px 0 0"><b>Cards here:</b> ${m.cards.map(esc).join(" · ")}</p>`:""}`);
    h+=card("Session",`<div class="stats"><div class="stat"><b>${s.count||0}</b><span>maps</span></div><div class="stat"><b>${dur(s.avgMs)}</b><span>avg map</span></div><div class="stat"><b>${s.div!=null?(+s.div).toFixed(1):"–"}</b><span>div / hour</span></div>${p.pages&&p.pages.session&&p.pages.session.net!=null?`<div class="stat"><b>${(+p.pages.session.net).toFixed(1)}</b><span>net worth (div)</span></div>`:""}</div>
      ${s.goal&&s.goal.label?`<div class="small" style="margin-top:8px">Goal: ${esc(s.goal.label)} · ${esc(s.goal.now||"")}${s.goal.done?" ✓":""}</div><div class="bar"><i style="width:${Math.round(Math.min(1,Math.max(0,s.goal.pct||0))*100)}%"></i></div>`:""}`);
    if(m.avoid&&m.avoid.length)h+=card("Mods you skip",m.avoid.map(a=>`<span class="pill bad">${esc(a)}</span>`).join(""));
    if(m.strat)h+=card("Atlas",`<div><b>${esc(m.strat.name)}</b></div>${m.next?`<div class="small muted">Next: ${esc(m.next)}</div>`:""}`);
  }
  const b=p.pages&&p.pages.build;
  if(b&&b.pct!=null)h+=card("Build",`<div class="row"><span class="big">${Math.round(b.pct)}%</span><span class="muted">of your goal build</span></div>${b.steps&&b.steps.length?`<ul class="small" style="margin-top:6px">${b.steps.slice(0,3).map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}`);
  const tr=p.pages&&p.pages.trades;
  if(tr&&((tr.alerts&&tr.alerts.length)||(tr.sold&&tr.sold.length)))h+=card("Prices",`${(tr.alerts||[]).map(a=>`<div>🔔 ${esc(a)}</div>`).join("")}${(tr.sold||[]).map(s=>`<div class="small muted">Sold: ${esc(s)}</div>`).join("")}`);
  $("out").innerHTML=h;
}
async function poll(){
  try{
    const r=await fetch("/data?k="+encodeURIComponent(key),{cache:"no-store"});
    if(r.status===403){$("err").style.display="block";$("err").innerHTML="<b>This link has expired.</b> Scan the new QR code in the desktop app (Desktop tools → Phone screen).";$("st").textContent="Link expired";$("st").className="st off";return setTimeout(poll,10000)}
    const txt=await r.text();lastOk=Date.now();$("err").style.display="none";
    if(txt!==lastJson){lastJson=txt;render(JSON.parse(txt))}
  }catch(e){}
  const ago=Math.round((Date.now()-lastOk)/1000);
  $("st").textContent=lastOk&&ago<8?"Live":lastOk?`No answer for ${ago}s`:"Can't reach your PC";$("st").className="st"+(lastOk&&ago<8?"":" off");
  setTimeout(poll,2000);
}
poll();
</script>
</body>
</html>
