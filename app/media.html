<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Exile Companion media</title>
<style>
:root{--panel:#141416;--line:#2a2a2f;--text:#e9e6df;--muted:#9a968e;--gold:#d4ae62;--bad:#e0584b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);font:12px "Segoe UI",system-ui,sans-serif;overflow:hidden}
.bar{height:34px;display:flex;align-items:center;gap:2px;padding:0 4px;background:var(--panel);border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;transition:opacity .2s}
body.through .bar{opacity:.55}
button,input{-webkit-app-region:no-drag;font:inherit}
button{background:transparent;color:var(--text);border:1px solid transparent;border-radius:6px;height:26px;min-width:26px;padding:0 6px;cursor:pointer}
button:hover{border-color:var(--line);background:#222226}
button.on{color:var(--gold);border-color:#7d6638}
.quick{display:flex;gap:2px}
.quick button{font-size:11px;color:var(--muted)}
.title{flex:1;min-width:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);padding:0 6px}
input[type=range]{width:56px;accent-color:var(--gold)}
.msg{position:fixed;left:8px;right:8px;top:40px;padding:6px 10px;border-radius:6px;background:#3a1f1a;border:1px solid var(--bad);display:none}
.through-note{display:none;color:var(--gold);font-size:11px;padding:0 6px;white-space:nowrap}
body.through .through-note{display:inline}
@media (max-width:420px){.quick,.op{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="quick">
    <button data-go="https://www.youtube.com/" title="YouTube">YT</button>
    <button data-go="https://music.youtube.com/" title="YouTube Music">Music</button>
    <button data-go="https://www.twitch.tv/" title="Twitch">Twitch</button>
  </div>
  <button id="back" title="Back" aria-label="Back">‹</button>
  <button id="play" title="Play / pause" aria-label="Play or pause">⏯</button>
  <span class="title" id="title"></span>
  <span class="through-note">click-through on</span>
  <input class="op" type="range" id="op" min="30" max="100" step="5" title="See-through" aria-label="Opacity">
  <button id="click" title="Click-through: clicks pass to the game" aria-label="Click-through">⇣</button>
  <button id="hide" title="Hide" aria-label="Hide">✕</button>
</div>
<div class="msg" id="msg"></div>
<script>
const D=window.exileDesktop,$=id=>document.getElementById(id);
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>D.mediaGo(b.dataset.go));
$("back").onclick=()=>D.mediaPlayer("back");$("play").onclick=()=>D.mediaPlayer("toggle");
$("click").onclick=()=>D.mediaPlayer("click");$("hide").onclick=()=>D.mediaPlayer("hide");
$("op").oninput=()=>D.mediaPlayer("opacity",+$("op").value/100);
function show(t){const m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(show.t);show.t=setTimeout(()=>m.style.display="none",4500)}
D.onMediaPlayer(s=>{if(!s)return;$("title").textContent=(s.title||"").replace(/ - YouTube( Music)?$/,"");$("play").textContent=s.has&&!s.paused?"⏸":"▶";$("click").classList.toggle("on",!!s.clickThrough);document.body.classList.toggle("through",!!s.clickThrough);if(s.opacity)$("op").value=Math.round(s.opacity*100)});
D.onMediaView(s=>{if(s&&s.error)show(s.error)});
D.onMediaBlocked(b=>show(`The mini player only opens YouTube, YouTube Music, Twitch, Kick and SoundCloud. Netflix, Hulu, Disney+ and Apple Music need copy protection the app doesn't have.`));
D.onMediaClick(on=>document.body.classList.toggle("through",!!on));
D.mediaPlayerState().then(s=>{if(s&&s.opacity)$("op").value=Math.round(s.opacity*100)});
</script>
</body>
</html>
