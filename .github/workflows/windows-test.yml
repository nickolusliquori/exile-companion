# Windows test run: builds the app and opens it on GitHub's Windows machine in test mode: every page,
# the overlay, price check, pinned browser and media player windows, reading a game log and Windows' media
# controls. Runs on pull requests (such as the weekly data update) and on demand. Releases run it too, before publishing.
name: Windows test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build the Path of Building helper (LuaJIT + pob/*.lua)
        shell: cmd
        run: scripts\pob\build-pob-runtime.cmd

      - name: Build the app (no installer)
        run: npx electron-builder --win dir --publish never
      - name: Get Path of Building (portable release) for the item comparison test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/PathOfBuildingCommunity/PathOfBuilding/releases/latest | ConvertFrom-Json
          $zip = $rel.assets | Where-Object { $_.name -match "Portable.*\.zip$" } | Select-Object -First 1
          Invoke-WebRequest $zip.browser_download_url -OutFile "$env:RUNNER_TEMP\pob.zip"
          Expand-Archive "$env:RUNNER_TEMP\pob.zip" -DestinationPath "$env:RUNNER_TEMP\pob"
          "EC_SMOKE_POB=$env:RUNNER_TEMP\pob" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Path of Building $($rel.tag_name)"

      - name: Open the app in test mode
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
