# Builds the Windows installer and publishes it to GitHub Releases whenever the version in
# package.json changes on main (and that version hasn't been released yet).
# The installed app's auto-updater reads these releases.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the tag + release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$v"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run checks
        run: npm run check

      # electron-builder only builds; the upload is done below with GitHub's CLI
      # (electron-builder 26 runs its GitHub publisher twice in parallel and the second one fails)
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          files=$(ls dist/*.exe dist/*.exe.blockmap; ls dist/*.yml | grep -v builder-)
          echo "$files"
          for f in $files; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          flags="--latest"; case "$v" in *-*) flags="--prerelease --latest=false";; esac
          notes="Download Exile-Companion-Setup-$v.exe below and run it. Installed copies update themselves."
          case "$v" in *-*) notes="Test build. Auto-update skips pre-releases, so only people who install this by hand get it.";; esac
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$v" --notes "$notes" $flags $files
