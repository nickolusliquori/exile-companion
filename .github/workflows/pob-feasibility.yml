# Experiment: Path of Building headless against its portable release (same layout as an install), with the
# app's own files (LuaJIT, pob-calc.lua, PoB's two headless helper files) in a separate folder. Not part of the app yet.
name: PoB feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pob:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Path of Building's portable release and the two headless helper files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/PathOfBuildingCommunity/PathOfBuilding/releases/latest | ConvertFrom-Json
          Write-Host "Path of Building $($rel.tag_name)"; $rel.assets | ForEach-Object { Write-Host "  asset: $($_.name) $($_.size)" }
          $zip = $rel.assets | Where-Object { $_.name -match "Portable.*\.zip$" } | Select-Object -First 1
          Invoke-WebRequest $zip.browser_download_url -OutFile pob.zip
          Expand-Archive pob.zip -DestinationPath pobinst
          $launch = Get-ChildItem pobinst -Recurse -Filter Launch.lua | Select-Object -First 1
          Write-Host "Launch.lua at: $($launch.FullName)"
          Get-ChildItem $launch.Directory | Select-Object -First 60 Name | ForEach-Object { Write-Host "  $($_.Name)" }
          foreach ($f in "HeadlessWrapper.lua","_SimpleGraphic.def.lua") { Write-Host "$f shipped: $(Test-Path (Join-Path $launch.Directory $f))" }
          "$($launch.Directory)" | Set-Content pobdir.txt
          New-Item -ItemType Directory app-pob | Out-Null
          foreach ($f in "HeadlessWrapper.lua","_SimpleGraphic.def.lua") { Invoke-WebRequest "https://raw.githubusercontent.com/PathOfBuildingCommunity/PathOfBuilding/$($rel.tag_name)/src/$f" -OutFile "app-pob\$f" }
          Copy-Item scripts\pob\pob-calc.lua app-pob\
      - name: Build LuaJIT (MIT)
        shell: cmd
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git luajit
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cd luajit\src
          call msvcbuild.bat
          copy luajit.exe ..\..\app-pob\
          copy lua51.dll ..\..\app-pob\
      - name: Run against the portable install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $pob = (Get-Content pobdir.txt).Trim(); $app = (Resolve-Path app-pob).Path
          node -e "const s=require('fs').readFileSync('app/js/01-core.js','utf8');const m=s.match(/const EXAMPLE_XML=\x60([\s\S]*?)\x60;/);require('fs').writeFileSync('example.xml',m[1])"
          $xml = (Resolve-Path example.xml).Path
          @"
          Rarity: RARE
          Test Ring
          Two-Stone Ring
          --------
          Item Level: 84
          --------
          +16% to Fire and Cold Resistances
          --------
          +80 to maximum Life
          +45% to Lightning Resistance
          +35% to Cold Resistance
          "@ -replace "(?m)^\s+", "" | Set-Content -Path item.txt -Encoding utf8
          $item = (Resolve-Path item.txt).Path
          $luaDir = if (Test-Path "$pob\lua") { "$pob\lua" } else { (Get-ChildItem $pob -Recurse -Filter dkjson.lua | Select-Object -First 1).Directory.FullName }
          Write-Host "lua dir: $luaDir"
          $env:LUA_PATH = "$luaDir\?.lua;$luaDir\?\init.lua;$pob\?.lua"
          $env:LUA_CPATH = "$pob\?.dll"
          Push-Location $pob
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & "$app\luajit.exe" "$app\pob-calc.lua" $xml $item "Ring 1" 2>&1 | Where-Object { $_ -notmatch "^(Loading|Unicode|Removing|Processing|Startup|Uniques|Rares|Viscera)" } | Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
          Write-Host "exit: $LASTEXITCODE  time: $($sw.ElapsedMilliseconds) ms"
          Pop-Location
